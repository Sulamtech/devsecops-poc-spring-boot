name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: integrity
    permissions:
      contents: read
    uses: Sulamtech/devsecops-poc-workflows/.github/workflows/reusable-caller-integrity.yml@e566ea21905b16278f56601b0dd79f8b5478cf31 # caller integrity detector

  tests:
    name: tests
    needs: integrity
    permissions:
      contents: read
    uses: Sulamtech/devsecops-poc-workflows/.github/workflows/reusable-maven-ci.yml@e566ea21905b16278f56601b0dd79f8b5478cf31 # poc-v1.1.0
    with:
      java-version: "21"

  security:
    name: security
    needs: integrity
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: Sulamtech/devsecops-poc-workflows/.github/workflows/reusable-security.yml@e566ea21905b16278f56601b0dd79f8b5478cf31 # poc-v1.1.1
    with:
      image-name: devsecops-poc-spring-boot
